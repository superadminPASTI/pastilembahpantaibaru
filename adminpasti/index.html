<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Monitoring Yuran Sekolah</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Excel Export (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- PDF Export (jsPDF & AutoTable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA: Manifest, Icons, Meta (Android/Chrome + iOS/Apple) -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="shortcut icon" href="icons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2ba401">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PASTI Admin">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f9ff; /* Soft Blue Background */
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .sidebar-active {
            background-color: #e0f2fe;
            color: #0ea5e9;
            font-weight: 700;
            border-right: 4px solid #0ea5e9;
        }
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        /* Checkbox Custom Style */
        .custom-checkbox:checked {
            background-color: #0ea5e9;
            border-color: #0ea5e9;
        }
        /* Animation */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Dropdown status styles */
        .status-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1em;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- config.js = SATU-SATUNYA fail yang beza antara client (isi
         APPS_SCRIPT_URL client tu). index.html sendiri DIKONGSI SAMA
         untuk semua client — jangan edit index.html terus per-client,
         copy versi terkini dari repo master bila ada update, config.js
         tak akan tersentuh oleh proses copy tu. Rujuk DEPLOYMENT-GUIDE.md
         bahagian "Setup Client Baharu — Frontend". -->
    <script src="config.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- KONFIGURASI PENTING ---
        // SEMUA data (login, senarai pelajar, transaksi) sekarang lalu
        // Apps Script (doPost) sahaja — TIADA lagi Publish-to-Web CSV.
        // APPS_SCRIPT_URL BUKAN declare di sini lagi — datang dari config.js
        // (loaded sebelum script ni, const-nya "global" merentas <script>
        // tag dalam page yang sama) supaya index.html boleh dikongsi
        // TANPA ubah per-client.
        const SESSION_STORAGE_KEY = 'tp_session';

        // --- CONFIG UNTUK DATABASE EXPORT ---
        const EXPORT_COLUMNS = [
            { id: 'Nama', label: 'Nama Pelajar' },
            { id: 'IC', label: 'No. KP / MyKid' },
            { id: 'Jantina', label: 'Jantina' },
            { id: 'Tahun', label: 'Tahun' },
            { id: 'Kelas', label: 'Kelas' },
            { id: 'Cawangan', label: 'Cawangan' },
            { id: 'Nama Waris', label: 'Nama Waris' },
            { id: 'No Tel Waris', label: 'No. Tel Waris' },
            { id: 'Alamat', label: 'Alamat' },
            { id: 'totalPaid', label: 'Jumlah Telah Bayar (RM)' },
            { id: 'balReg', label: 'Baki Pendaftaran (RM)' },
            { id: 'balMonthly', label: 'Baki Bulanan (RM)' },
            { id: 'currentBalance', label: 'Jumlah Baki Hutang (RM)' },
            { id: 'status_text', label: 'Status Akaun' }
        ];

        // --- HELPER COMPONENT: ICON ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const iconName = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
                    const iconNode = window.lucide.icons[iconName];

                    if (iconNode && iconRef.current) {
                        iconRef.current.innerHTML = '';
                        if (window.lucide.createElement) {
                            const svgElement = window.lucide.createElement(iconNode);
                            svgElement.setAttribute('width', size);
                            svgElement.setAttribute('height', size);
                            svgElement.setAttribute('stroke-width', 2);
                            if (className) {
                                const existingClass = svgElement.getAttribute('class') || '';
                                svgElement.setAttribute('class', `${existingClass} ${className}`.trim());
                            }
                            iconRef.current.appendChild(svgElement);
                        }
                    }
                }
            }, [name, size, className]);

            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        // --- COMPONENTS ---
        const Loading = () => (
            <div className="flex flex-col items-center justify-center h-screen bg-sky-50">
                <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-sky-500 mb-4"></div>
                <h2 className="text-xl font-bold text-sky-700 animate-pulse">Sedang Memuat Data Sekolah...</h2>
                <p className="text-sky-500 text-sm mt-2">Menghubungkan ke server</p>
            </div>
        );

        const ErrorScreen = ({ message, onRetry }) => (
            <div className="flex flex-col items-center justify-center h-screen bg-red-50 text-center p-4">
                <div className="text-red-500 mb-4">
                    <Icon name="alert-triangle" size={64} />
                </div>
                <h2 className="text-2xl font-bold text-red-700 mb-2">Gagal Memuat Data</h2>
                <p className="text-red-600 mb-6 max-w-md">{message}</p>
                <button onClick={onRetry} className="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-full font-semibold transition shadow-lg">
                    Cuba Lagi
                </button>
            </div>
        );

        const StatCard = ({ title, value, subtext, color, iconName, iconColorClass }) => (
            <div className={`glass-card p-6 rounded-2xl shadow-sm border-l-4 ${color} transition hover:shadow-md`}>
                <div className="flex justify-between items-start">
                    <div>
                        <p className="text-gray-500 text-sm font-semibold uppercase tracking-wider">{title}</p>
                        <h3 className="text-3xl font-bold text-gray-800 mt-1">{value}</h3>
                        {subtext && <p className="text-xs text-gray-400 mt-2">{subtext}</p>}
                    </div>
                    <div className={`p-3 rounded-xl bg-white shadow-sm text-${iconColorClass}`}>
                        <Icon name={iconName} size={24} className={`text-${iconColorClass}`} />
                    </div>
                </div>
            </div>
        );

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [currentUser, setCurrentUser] = useState(() => {
                try {
                    const saved = sessionStorage.getItem(SESSION_STORAGE_KEY);
                    return saved ? JSON.parse(saved) : null;
                } catch (e) {
                    return null;
                }
            });
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);

            // --- Toast (notifikasi popup "Berjaya"/ralat) ---
            // Satu senarai supaya boleh papar >1 toast serentak (cth: upload
            // pantas berturut-turut) — setiap toast auto-hilang lepas 3.5 saat.
            // showToast() dipanggil di HUJUNG setiap action simpan/upload/muat
            // (rujuk saveStudent, uploadAsset, togglePermission, dll di bawah).
            const [toasts, setToasts] = useState([]);
            const showToast = (message, type = 'success') => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3500);
            };

            const [view, setView] = useState('dashboard');
            const [students, setStudents] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [updatingStatus, setUpdatingStatus] = useState(null); 
            
            // --- State untuk Tapis Jadual Transaksi ---
            const [txFilters, setTxFilters] = useState({
                date: '',
                name: '',
                type: 'Semua',
                desc: '',
                amount: '',
                verification: 'Semua'
            });

            const [exportCols, setExportCols] = useState(EXPORT_COLUMNS.map(c => c.id));
            const [filters, setFilters] = useState({
                search: '',
                class: 'Semua',
                branch: 'Semua',
                year: 'Semua',
                month: 'Semua',
                status: 'Semua',
                type: 'Semua'
            });

            // --- State untuk Urus Admin (SuperAdmin sahaja) ---
            const [admins, setAdmins] = useState([]);
            const [loadingAdmins, setLoadingAdmins] = useState(false);
            const [savingAdmin, setSavingAdmin] = useState(false);
            const [deletingAdminEmail, setDeletingAdminEmail] = useState(null);
            const [adminFormError, setAdminFormError] = useState('');
            const [adminFormSuccess, setAdminFormSuccess] = useState('');
            const [adminForm, setAdminForm] = useState({ email: '', password: '', role: 'admin', cawangan: '' });

            // --- State untuk Log Masuk (SuperAdmin sahaja) ---
            const [loginLogs, setLoginLogs] = useState([]);
            const [loadingLogs, setLoadingLogs] = useState(false);
            const [logFilter, setLogFilter] = useState({ email: '', result: 'Semua' });

            // --- State untuk Database Guru (Admin & SuperAdmin) ---
            const [guruList, setGuruList] = useState([]);
            const [loadingGuru, setLoadingGuru] = useState(false);
            const [savingGuru, setSavingGuru] = useState(false);
            const [deletingGuruId, setDeletingGuruId] = useState(null);
            const [deletingStudentIC, setDeletingStudentIC] = useState(null);
            const [viewingFileUrl, setViewingFileUrl] = useState(null);
            const [viewingFileTitle, setViewingFileTitle] = useState('');
            const [whatsappModalStudent, setWhatsappModalStudent] = useState(null);
            const [whatsappSelectedMonths, setWhatsappSelectedMonths] = useState([]);
            const [whatsappIncludeReg, setWhatsappIncludeReg] = useState(false);
            const [whatsappPhoneChoice, setWhatsappPhoneChoice] = useState(0);
            const [guruFormError, setGuruFormError] = useState('');
            const [guruFormSuccess, setGuruFormSuccess] = useState('');
            const [guruForm, setGuruForm] = useState({ id: '', nama: '', noTelefon: '', cawangan: '', kelas: '' });

            // --- Tetapan: Configurable Permissions + Auto-Bil Bulanan ---
            const [settingsPermissions, setSettingsPermissions] = useState([]);
            const [loadingSettings, setLoadingSettings] = useState(false);
            const [savingPermissionAction, setSavingPermissionAction] = useState(null);
            const [autoBillActive, setAutoBillActive] = useState(null); // null = belum load
            const [loadingAutoBill, setLoadingAutoBill] = useState(false);
            const [togglingAutoBill, setTogglingAutoBill] = useState(false);
            const [runningAutoBillNow, setRunningAutoBillNow] = useState(false);
            const [autoBillMessage, setAutoBillMessage] = useState('');

            // --- Matrix Bayaran: status pelajar x bulan untuk satu tahun ---
            const [matrixData, setMatrixData] = useState(null); // { year, months, rows }
            const [loadingMatrix, setLoadingMatrix] = useState(false);
            const [matrixError, setMatrixError] = useState('');
            const [matrixYear, setMatrixYear] = useState(new Date().getFullYear());
            const [matrixBranch, setMatrixBranch] = useState('Semua');
            const [matrixSearch, setMatrixSearch] = useState('');

            // --- Tetapan Umum: label paparan yang admin boleh tukar sendiri
            // (cth "Yuran Pendaftaran" -> "Yuran Tahunan"). GET_APP_SETTINGS
            // tiada token (awam) — sengaja fetch awal, tak tunggu login, sebab
            // nilai ni cuma teks paparan, bukan data sensitif. Default di bawah
            // (sebelum fetch selesai) sepadan dengan default backend supaya
            // tiada "flash" teks lama sekejap sebelum tertukar.
            const [appSettings, setAppSettings] = useState({ LABEL_PENDAFTARAN: 'Yuran Tahunan' });
            // appSettingsDefs = [{key,label}] dari backend (APP_SETTINGS_DEFS_,
            // satu sumber kebenaran) — borang Tetapan Sistem loop atas ni,
            // BUKAN hardcode satu-satu field, supaya key Config baharu yang
            // ditambah dalam Code.gs terus muncul dalam UI tanpa edit fail ni.
            const [appSettingsDefs, setAppSettingsDefs] = useState([]);
            const [configFormValues, setConfigFormValues] = useState({});
            const [savingConfigKey, setSavingConfigKey] = useState('');
            const [configSaveMessage, setConfigSaveMessage] = useState('');
            // Key yang assetnya (Logo/QR) sedang dimuat naik — LOGO_FILE_ID/
            // QR_FILE_ID di-special-case dalam borang Tetapan Sistem sebagai
            // upload button + preview (bukan input teks ID), rujuk uploadAsset().
            const [uploadingAsset, setUploadingAsset] = useState('');

            // --- Yuran Lain-Lain (ad-hoc, cth Yuran Baju/Event) ---
            const [adhocFees, setAdhocFees] = useState([]);
            const [loadingAdhocFees, setLoadingAdhocFees] = useState(false);
            const [adhocFeesError, setAdhocFeesError] = useState('');
            const [updatingAdhocStatus, setUpdatingAdhocStatus] = useState(null);
            const [adhocForm, setAdhocForm] = useState({ jenis: '', jumlah: '' });
            const [adhocSelectedICs, setAdhocSelectedICs] = useState([]);
            const [adhocTargetBranch, setAdhocTargetBranch] = useState('Semua');
            const [adhocStudentSearch, setAdhocStudentSearch] = useState('');
            const [creatingAdhocFee, setCreatingAdhocFee] = useState(false);
            const [adhocFormMessage, setAdhocFormMessage] = useState('');
            const [adhocFilterStatus, setAdhocFilterStatus] = useState('Semua');
            const [adhocListSearch, setAdhocListSearch] = useState('');
            // Drawer nav mobile — sidebar <aside> di bawah ni jadi single source
            // of truth untuk SEMUA nav (desktop fixed, mobile slide-in drawer).
            // Elak ulang isu lama: header mobile berasingan yang hardcode 4
            // butang je dan tak pernah disync bila tab baru ditambah.
            const [mobileNavOpen, setMobileNavOpen] = useState(false);
            // Label paparan "Yuran Pendaftaran" — boleh admin tukar sendiri di
            // Tetapan Sistem (default "Yuran Tahunan"). Dideklarasi AWAL (bukan
            // dekat "return") sebab beberapa useMemo (cth `stats`) guna nilai
            // ni SEMASA render — kalau declare lewat, kena Temporal Dead Zone
            // error (const belum "wujud" lagi masa useMemo tu execute).
            // Guna shorthand ni di seluruh UI sahaja — jangan tukar nilai
            // state/field (yuranPendaftaran, filters.type === 'Pendaftaran',
            // dsb.) yang masih perlu kekal 'Pendaftaran' sebab ia schema/logic
            // internal, bukan teks paparan.
            const pendaftaranLabel = appSettings.LABEL_PENDAFTARAN || 'Yuran Pendaftaran';
            // Sama teknik/sebab macam pendaftaranLabel di atas (TDZ-safe, awal
            // dalam component body) — nama sistem & footer boleh client tukar
            // sendiri di Tetapan Sistem. Default generic (bukan nama client
            // tertentu) sebab index.html ni dikongsi SAMA untuk semua client
            // PASTI — cuma config.js (APPS_SCRIPT_URL) yang berbeza per client.
            const namaSistem = appSettings.NAMA_SISTEM || 'Pengurusan PASTI';
            const footerTeks = appSettings.FOOTER_TEKS || '© 2026 Sistem Pengurusan PASTI';

            // Helper function to parse dates correctly for sorting (DD/MM/YYYY HH:mm:ss)
            const parseDateString = (dateStr) => {
                if (!dateStr) return 0;
                try {
                    const [datePart, timePart] = dateStr.split(' ');
                    if (!datePart) return 0;
                    const [day, month, year] = datePart.split('/');
                    const [hour, min, sec] = (timePart || '00:00:00').split(':');
                    return new Date(year, month - 1, day, hour, min, sec).getTime();
                } catch (e) {
                    return 0; // Fallback if parsing fails
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsLoggingIn(true);
                setLoginError('');
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'LOGIN', email: loginEmail, password: loginPassword, userAgent: navigator.userAgent })
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        const user = { Email: result.email, Role: result.role, Cawangan: result.cawangan, token: result.token, permissions: result.permissions || {} };
                        setCurrentUser(user);
                        try { sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(user)); } catch (e) {}
                        // Kunci filter cawangan jika dia bukan superadmin
                        setFilters(prev => ({ ...prev, branch: user.Role.toLowerCase() === 'superadmin' ? 'Semua' : user.Cawangan }));
                    } else {
                        setLoginError(result.message || 'E-mel atau Kata Laluan tidak sah.');
                    }
                } catch (err) {
                    setLoginError('Ralat menyambung ke server. Sila cuba lagi.');
                }
                setIsLoggingIn(false);
            };

            const handleLogout = () => {
                if (currentUser && currentUser.token) {
                    fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'LOGOUT', token: currentUser.token }) }).catch(() => {});
                }
                try { sessionStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
                setCurrentUser(null);
                setView('dashboard');
                setStudents([]);
                setTransactions([]);
                setLoginEmail('');
                setLoginPassword('');
            };

            const fetchData = async () => {
                setLoading(true);
                setError(null);
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'GET_DASHBOARD_DATA', token: currentUser.token })
                    });
                    const result = await response.json();

                    if (result.result !== 'success') {
                        const msg = (result.message || '').toLowerCase();
                        if (msg.includes('unauthorized') || msg.includes('sesi tamat') || msg.includes('forbidden')) {
                            handleLogout();
                            return;
                        }
                        throw new Error(result.message || 'Gagal memuat data dari server.');
                    }

                    // Server dah kira isolasi cawangan — tak perlu filter lagi kat client
                    const allTransactions = result.transactions || [];

                    // SORTING LOGIC: Newest to Oldest explicitly using Custom Date Parser
                    allTransactions.sort((a, b) => parseDateString(b.Timestamp) - parseDateString(a.Timestamp));

                    setStudents(result.students || []);
                    setTransactions(allTransactions);
                    if (result.permissions) {
                        setCurrentUser(prev => {
                            if (!prev) return prev;
                            const updated = { ...prev, permissions: result.permissions };
                            try { sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(updated)); } catch (e) {}
                            return updated;
                        });
                    }
                } catch (err) {
                    console.error("Dashboard data error:", err);
                    setError(err.message || "Gagal membaca data dari server.");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (currentUser) {
                    fetchData();
                }
                // Guna currentUser?.token (bukan currentUser object) sebab fetchData()
                // sendiri panggil setCurrentUser(prev => ({...prev, permissions})) untuk
                // sync permissions terkini — spread tu cipta object reference BAHARU
                // setiap kali walaupun value sama. Kalau dependency ni currentUser (whole
                // object), React nampak reference berubah -> effect fire semula ->
                // fetchData() lagi -> setCurrentUser lagi -> infinite loop (inilah punca
                // "stuck loading" + ratusan request exec berulang). token cuma berubah
                // bila login/logout betul-betul jadi, jadi selamat sebagai dependency.
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [currentUser?.token]);

            // canDo(action): SuperAdmin sentiasa true (bypass). Admin ikut
            // permissions map dari server (login/dashboard response) — fail-open
            // (tak listed = allowed), cuma eksplisit false yang sekat. Dipakai
            // untuk SORONGKAN button (UX), backend tetap enforce sendiri.
            const canDo = (action) => {
                if (!currentUser) return false;
                if (currentUser.Role.toLowerCase() === 'superadmin') return true;
                return !(currentUser.permissions && currentUser.permissions[action] === false);
            };

            const fetchPermissions = async () => {
                setLoadingSettings(true);
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'GET_PERMISSIONS', token: currentUser.token })
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        setSettingsPermissions(result.permissions || []);
                    }
                } catch (err) {
                    console.error('Gagal muat tetapan kebenaran:', err);
                } finally {
                    setLoadingSettings(false);
                }
            };

            const togglePermission = async (action, newValue) => {
                setSavingPermissionAction(action);
                setSettingsPermissions(prev => prev.map(p => p.action === action ? { ...p, adminAllowed: newValue } : p));
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'SAVE_PERMISSIONS',
                            token: currentUser.token,
                            updates: [{ action: action, adminAllowed: newValue }]
                        })
                    });
                    const result = await response.json();
                    if (result.result === 'success') {
                        showToast('Kebenaran dikemaskini.');
                    } else {
                        // rollback kalau gagal
                        setSettingsPermissions(prev => prev.map(p => p.action === action ? { ...p, adminAllowed: !newValue } : p));
                        showToast(result.message || 'Gagal simpan kebenaran.', 'error');

            // Auto-detect Jantina dari "bin"/"binti" dalam Nama. \b = word
            // boundary — "binti" disemak DULU (dan \bbin\b memang takkan
            // match "binti" pun sebab lepas "bin" ada "ti", tiada boundary)
            // supaya "Fatimah Binti Ali" tak silap detect sebagai Lelaki.
            const detectJantinaFromName = (nama) => {
                if (/\bbinti\b/i.test(nama)) return 'P';

            // Auto-kira Tahun (umur) dari 2 digit pertama IC — anggap lahir

            // macam pengiraan IC dewasa). Cth: IC mula "22" -> lahir 2022 ->
            // umur (tahun semasa - 2022).
            const calculateAgeFromIC = (ic) => {
                const digits = (ic || '').toString().replace(/[^0-9]/g, '');
                if (digits.length < 2) return null;
                const yy = parseInt(digits.substring(0, 2), 10);
                if (isNaN(yy)) return null;
                const birthYear = 2000 + yy;
                const age = new Date().getFullYear() - birthYear;
                return (age >= 0 && age <= 25) ? String(age) : null; // sanity check, elak nombor pelik
            };

            // --- Muat Naik Pukal (CSV) ---
            const csvEscape = (val) => {
                const str = String(val === undefined || val === null ? '' : val);
                if (/[",\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
                return str;

            const downloadStudentTemplate = () => {
                const exampleRow = {

                    'Jantina': 'L',
                    'Tahun': '2026',
                    'Kelas': 'Iqra 2',

                const headerLine = STUDENT_CSV_HEADERS.map(csvEscape).join(',');

                const csv = headerLine + '\r\n' + dataLine + '\r\n';

            // Anotasi setiap baris CSV yang di-parse dengan status pra-semak

            // rujuk handleBulkAddStudents_ dalam Code.gs).
            const annotateBulkRows = (parsedRows) => {
                const existingIcSet = new Set(students.map(s => (s.IC || '').toString().replace(/[^0-9]/g, '')).filter(Boolean));
                const seenInFile = new Set();
                const isSuperAdmin = currentUser.Role.toLowerCase() === 'superadmin';
                return parsedRows.map((r, idx) => {
                    const nama = (r['Nama'] || '').toString().trim();
                    const ic = (r['IC'] || '').toString().trim();
                    const icDigits = ic.replace(/[^0-9]/g, '');
                    let status = 'ok';
                    let reason = '';
                    const rowCawangan = (r['Cawangan'] || '').toString().trim();

                    if (!nama || !icDigits) {
                        status = 'error'; reason = 'Nama atau No. IC kosong';
                    } else if (existingIcSet.has(icDigits) || seenInFile.has(icDigits)) {
                        status = 'error'; reason = 'No. IC sudah wujud (sistem atau berulang dalam fail ini)';
                    } else if (isSuperAdmin && !rowCawangan) {
                        status = 'error'; reason = 'Cawangan kosong (wajib untuk SuperAdmin)';
                    } else if (!isSuperAdmin && rowCawangan && rowCawangan !== currentUser.Cawangan) {
                        status = 'warning'; reason = 'Akan ditukar ke cawangan anda (' + currentUser.Cawangan + ')';
                    }
                    if (status !== 'error' && icDigits) seenInFile.add(icDigits);
                    return Object.assign({ _row: idx + 2, _status: status, _reason: reason }, r);
                });
            };

            const updateStatus = async (tx, newStatus) => {

                const txId = tx.Timestamp + tx.NAMA;

                try {

                        token: currentUser.token,
                        sheetType: tx._type,
                        timestamp: tx.Timestamp,
                        ic: tx.IC || '',
                        nama: tx.NAMA,
                        newStatus: newStatus
                    };

                    const updatedTransactions = transactions.map(t => {
                        if (t.Timestamp === tx.Timestamp && t.NAMA === tx.NAMA) {
                            return { ...t, VERIFICATION: newStatus };
                        }
                        return t;
                    });
                    setTransactions(updatedTransactions);

                    const response = await fetch(APPS_SCRIPT_URL, { 
                        method: 'POST', 
                        body: JSON.stringify(payload) 
                    });
                    const result = await response.json();
                    
                    if (result.result !== 'success') {
                        throw new Error(result.message || "Gagal kemas kini di server");
                    }
                    showToast(newStatus === 'VERIFIED' ? 'Bayaran disahkan.' : (newStatus === 'REJECTED' ? 'Bayaran ditolak.' : 'Status dikemaskini.'));
                } catch (err) {
                    console.error("Kemas kini gagal:", err);
                    showToast("Gagal mengemaskini status: " + err.message, 'error');
                    fetchData();
                } finally {

            const studentData = useMemo(() => {
                return students.map(student => {
                    const studentTxs = transactions.filter(t => t['IC'] === student['IC']);
                    const monthlyTxs = studentTxs.filter(t => t._type === 'Bulanan');
                    const regTxs = studentTxs.filter(t => t._type === 'Pendaftaran');

                    let balMonthly = 0;
                    if (monthlyTxs.length > 0) {
                        const latest = monthlyTxs.sort((a, b) => parseDateString(b['Timestamp']) - parseDateString(a['Timestamp']))[0];
                        balMonthly = parseFloat((latest['BAKI'] || '0').replace(/[^0-9.-]+/g,""));
                    } else {
                        balMonthly = parseFloat((student['Yuran Bulanan'] || '0').replace(/[^0-9.-]+/g,""));
                    }

                    let balReg = 0;
                    if (regTxs.length > 0) {
                         const latest = regTxs.sort((a, b) => parseDateString(b['Timestamp']) - parseDateString(a['Timestamp']))[0];
                         balReg = parseFloat((latest['BAKI'] || '0').replace(/[^0-9.-]+/g,""));
                    } else {
                        balReg = parseFloat((student['Yuran Pendaftaran'] || '0').replace(/[^0-9.-]+/g,""));
                    }

                    const totalPaid = studentTxs.reduce((sum, tx) => {
                        const amount = parseFloat((tx['JUMLAH BAYARAN'] || '0').replace(/[^0-9.-]+/g,""));
                        return sum + (isNaN(amount) ? 0 : amount);
                    }, 0);

                    const currentBalance = (isNaN(balMonthly) ? 0 : balMonthly) + (isNaN(balReg) ? 0 : balReg);

                    return {
                        ...student,
                        transactions: studentTxs,
                        totalPaid: totalPaid,
                        currentBalance: currentBalance,
                        balMonthly: isNaN(balMonthly) ? 0 : balMonthly,
                        balReg: isNaN(balReg) ? 0 : balReg,
                        status_text: currentBalance > 0 ? 'Tertunggak' : 'Selesai'
                    };
                });
            }, [students, transactions]);

            const filteredStudents = useMemo(() => {
                return studentData.filter(s => {
                    const matchSearch = (s['Nama'] || '').toLowerCase().includes(filters.search.toLowerCase()) || 
                                        (s['IC'] || '').includes(filters.search);
                    const matchClass = filters.class === 'Semua' || s['Kelas'] === filters.class;
                    const matchBranch = filters.branch === 'Semua' || s['Cawangan'] === filters.branch;
                    const matchYear = filters.year === 'Semua' || s['Tahun'] === filters.year;
                    const matchMonth = filters.month === 'Semua' || s.transactions.some(t => t['BULAN'] === filters.month);

                    let matchStatus = true;
                    let balanceToCheck = s.currentBalance;
                    if (filters.type === 'Pendaftaran') balanceToCheck = s.balReg;
                    if (filters.type === 'Bulanan') balanceToCheck = s.balMonthly;

                    if (filters.status === 'Tertunggak') matchStatus = balanceToCheck > 0;
                    if (filters.status === 'Selesai') matchStatus = balanceToCheck <= 0;
                    
                    return matchSearch && matchClass && matchBranch && matchYear && matchMonth && matchStatus;
                });
            }, [studentData, filters]);

            // --- Logik Tapisan (Filter) Jadual Transaksi ---
            const filteredTransactionsList = useMemo(() => {
                return transactions.filter(tx => {
                    const matchDate = (tx.Timestamp || '').toLowerCase().includes(txFilters.date.toLowerCase());
                    const matchName = (tx.NAMA || '').toLowerCase().includes(txFilters.name.toLowerCase());
                    const matchType = txFilters.type === 'Semua' || tx._type === txFilters.type;
                    const matchDesc = (tx.BULAN || tx['JENIS YURAN'] || '').toLowerCase().includes(txFilters.desc.toLowerCase());
                    const matchAmount = (tx['JUMLAH BAYARAN'] || '').toString().toLowerCase().includes(txFilters.amount.toLowerCase());
                    const txStatus = tx['VERIFICATION'] || 'PENDING';
                    const matchVer = txFilters.verification === 'Semua' || txStatus === txFilters.verification;

                    return matchDate && matchName && matchType && matchDesc && matchAmount && matchVer;
                });
            }, [transactions, txFilters]);

            // --- Pagination Rekod Transaksi — 30 rekod setiap muka surat ---
            const TX_PER_PAGE = 30;
            const [txPage, setTxPage] = useState(1);
            const txTotalPages = Math.max(1, Math.ceil(filteredTransactionsList.length / TX_PER_PAGE));

            // Reset ke muka surat 1 bila-bila tapisan tukar (elak "stuck" di
            // muka surat lama yang dah tak relevan lepas tapis).
            useEffect(() => { setTxPage(1); }, [txFilters]);
            // Selamatkan diri kalau muka surat semasa jadi tak sah (cth: hasil
            // tapisan mengecil sehingga jumlah muka surat kurang dari sebelum ini).
            useEffect(() => { if (txPage > txTotalPages) setTxPage(txTotalPages); }, [txTotalPages]);

            const paginatedTransactions = useMemo(() => {
                const start = (txPage - 1) * TX_PER_PAGE;
                return filteredTransactionsList.slice(start, start + TX_PER_PAGE);
            }, [filteredTransactionsList, txPage]);

            const stats = useMemo(() => {
                const totalStudents = studentData.length;
                const totalOutstanding = studentData.reduce((sum, student) => sum + (student.currentBalance > 0 ? student.currentBalance : 0), 0);
                const totalCollection = transactions.reduce((sum, tx) => {
                      const amount = parseFloat((tx['JUMLAH BAYARAN'] || '0').replace(/[^0-9.-]+/g,""));
                      return sum + (isNaN(amount) ? 0 : amount);
                }, 0);
                
                const collectionByMonth = {};
                transactions.forEach(tx => {
                    let month = tx['BULAN'];
                    if (!month || month.trim() === '') month = pendaftaranLabel;
                    const amount = parseFloat((tx['JUMLAH BAYARAN'] || '0').replace(/[^0-9.-]+/g,""));
                    if (!collectionByMonth[month]) collectionByMonth[month] = 0;
                    collectionByMonth[month] += (isNaN(amount) ? 0 : amount);
                });

                return { totalStudents, totalCollection, totalOutstanding, collectionByMonth };
            }, [studentData, transactions, pendaftaranLabel]);

            const classes = useMemo(() => ['Semua', ...Array.from(new Set(students.map(s => s['Kelas']).filter(Boolean)))], [students]);
            const branches = useMemo(() => {
                if (currentUser && currentUser.Role.toLowerCase() !== 'superadmin') return [currentUser.Cawangan];
                return ['Semua', ...Array.from(new Set(students.map(s => s['Cawangan']).filter(Boolean)))];
            }, [students, currentUser]);
            // Senarai cawangan sebenar (tiada 'Semua') — untuk dropdown borang Urus Admin
            const realBranches = useMemo(() => Array.from(new Set(students.map(s => s['Cawangan']).filter(Boolean))), [students]);
            // Guru ditapis ikut Cawangan yang dipilih dalam borang Tambah/Edit Pelajar —
            // sumber pilihan dropdown "Guru Kelas" (rujuk saveStudent/openAddStudentForm).
            const guruForBranch = useMemo(() => guruList.filter(g => !studentForm.cawangan || g.cawangan === studentForm.cawangan), [guruList, studentForm.cawangan]);
            const years = useMemo(() => ['Semua', ...Array.from(new Set(students.map(s => s['Tahun']).filter(Boolean)))].sort(), [students]);
            const months = useMemo(() => ['Semua', ...Array.from(new Set(transactions.map(t => t['BULAN']).filter(Boolean)))], [transactions]);

            const formatRM = (val) => "RM " + (parseFloat(val) || 0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            // Parse "No Tel Waris" — boleh JSON array (2+ nombor, contoh:
            // ["0123456789","0198765432"]) ATAU plain single nombor (data
            // lama, backward compatible).
            const parsePhoneNumbers = (raw) => {
                if (!raw) return [];
                const str = raw.toString().trim();
                if (!str) return [];
                if (str.charAt(0) === '[') {
                    try {
                        const arr = JSON.parse(str);
                        if (Array.isArray(arr)) return arr.map(v => String(v).trim()).filter(Boolean);
                    } catch (e) {
                        // JSON tak valid — fallback ke bawah
                    }
                }
                return [str];
            };
            const formatPhoneList = (raw) => parsePhoneNumbers(raw).join(' / ');

            const getPhotoUrl = (url) => {
                if (!url) return null;
                if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
                    const match = url.match(/(?:\/d\/|id=)([-\w]+)/);
                    if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
                return url;
            };

            // Drive "view" link -> embeddable "preview" iframe link. Drive punya
            // preview endpoint sendiri kendali imej/PDF secara generik (tak perlu
            // teka jenis fail di client) — dipakai untuk modal Lihat Resit di bawah.
            const getFileEmbedUrl = (url) => {
                if (!url) return null;
                const match = url.match(/(?:\/d\/|id=)([-\w]+)/);
                if (match && match[1]) return `https://drive.google.com/file/d/${match[1]}/preview`;
                return url;
            };

            const MONTHS_12 = ["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];

            // Buka modal pilihan WhatsApp (nombor + bulan/pendaftaran) — GANTI
            // hantar-terus-ke-phones[0] sebelum ini, sekarang admin pilih dulu.
            const openWhatsappModal = (student) => {
                setWhatsappModalStudent(student);
                setWhatsappSelectedMonths([]);
                setWhatsappIncludeReg(false);
                setWhatsappPhoneChoice(0);
            };

            // Tanda visual sahaja (bukan block) — bantu admin tengok bulan mana
            // dah ada rekod bayaran VERIFIED sebelum tick untuk reminder.
            const isMonthPaid = (student, month) => {
                return (student.transactions || []).some(t => t._type === 'Bulanan' && t['BULAN'] === month && t['VERIFICATION'] === 'VERIFIED');
            };

            const toggleWhatsappMonth = (month) => {
                setWhatsappSelectedMonths(prev => prev.includes(month) ? prev.filter(m => m !== month) : [...prev, month]);
            };

            const sendWhatsappCustom = () => {
                const student = whatsappModalStudent;
                if (!student) return;
                const phones = parsePhoneNumbers(student['No Tel Waris']);
                const phone = phones[whatsappPhoneChoice] || phones[0];
                if (!phone) { alert('Nombor telefon waris tiada.'); return; }
                let cleanPhone = phone.toString().replace(/[^0-9]/g, '');
                if (cleanPhone.startsWith('0')) cleanPhone = '60' + cleanPhone.substring(1);

                if (whatsappSelectedMonths.length === 0 && !whatsappIncludeReg) {
                    alert('Sila pilih sekurang-kurangnya satu bulan atau ' + pendaftaranLabel + '.');
                    return;
                }

                const monthlyFee = parseFloat((student['Yuran Bulanan'] || '0').toString().replace(/[^0-9.-]+/g, '')) || 0;
                const regFee = whatsappIncludeReg ? (student.balReg > 0 ? student.balReg : 0) : 0;
                const monthsTotal = whatsappSelectedMonths.length * monthlyFee;
                const total = monthsTotal + regFee;

                let itemsList = whatsappSelectedMonths.map(m => `• Yuran Bulanan (${m}): ${formatRM(monthlyFee)}`).join('\n');
                if (whatsappIncludeReg) {
                    itemsList += (itemsList ? '\n' : '') + `• ${pendaftaranLabel}: ${formatRM(regFee)}`;
                }

                const message = `Assalamualaikum dan salam sejahtera En/Cik ${student['Nama Waris'] || ''}\n\nBerikut merupakan baki tertunggak yang perlu dibayar bagi *${student.Nama}*:\n\n${itemsList}\n------------------------------\n*Jumlah Keseluruhan: ${formatRM(total)}*\n\nMohon jelaskan bayaran secepat mungkin. Terima kasih.`;

                window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`, '_blank');
                setWhatsappModalStudent(null);
            };

            const toggleColumn = (id) => {
                if (exportCols.includes(id)) {
                    setExportCols(exportCols.filter(col => col !== id));
                } else {
                    setExportCols([...exportCols, id]);
                }
            };

            const toggleAllColumns = () => {
                if (exportCols.length === EXPORT_COLUMNS.length) {
                    setExportCols([]);
                } else {
                    setExportCols(EXPORT_COLUMNS.map(c => c.id));
                }
            };

            const generateExportData = () => {
                return filteredStudents.map(student => {
                    const row = {};
                    EXPORT_COLUMNS.forEach(col => {
                        if (exportCols.includes(col.id)) {
                            if (['totalPaid', 'balReg', 'balMonthly', 'currentBalance'].includes(col.id)) {
                                row[col.label] = (parseFloat(student[col.id]) || 0).toFixed(2);
                            } else if (col.id === 'No Tel Waris') {
                                row[col.label] = formatPhoneList(student[col.id]) || '-';
                            } else {
                                row[col.label] = student[col.id] || '-';
                            }
                        }
                    });
                    return row;
                });
            };

            const downloadExcel = () => {
                const data = generateExportData();
                if (data.length === 0) { 
                    alert("Tiada data untuk dimuat turun."); 
                    return; 
                }
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Database Pelajar");
                XLSX.writeFile(wb, "Database_Pelajar_Tadika_Pintar.xlsx");
            };

            const downloadPDF = () => {
                const data = generateExportData();
                if (data.length === 0) { 
                    alert("Tiada data untuk dimuat turun."); 
                    return; 
                }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape' });
                const headers = EXPORT_COLUMNS.filter(c => exportCols.includes(c.id)).map(c => c.label);
                const rows = data.map(obj => Object.values(obj));
                doc.setFontSize(18);
                doc.text("Database Pelajar - " + namaSistem, 14, 20);
                doc.setFontSize(10);
                doc.text(`Tarikh Dijana: ${new Date().toLocaleDateString('ms-MY')}`, 14, 28);
                doc.text(`Jumlah Rekod: ${rows.length}`, 14, 33);
                doc.autoTable({ 
                    head: [headers], 
                    body: rows, 
                    startY: 40, 
                    theme: 'grid', 
                    styles: { fontSize: 8 }, 
                    headStyles: { fillColor: [14, 165, 233] } 
                });
                doc.save("Database_Pelajar_Tadika_Pintar.pdf");
            };

            useEffect(() => {
                if (view === 'dashboard' && !loading && document.getElementById('feesChart')) {
                    const ctx = document.getElementById('feesChart').getContext('2d');
                    if (window.myChart) window.myChart.destroy();
                    const labels = Object.keys(stats.collectionByMonth);
                    const data = Object.values(stats.collectionByMonth);
                    window.myChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Jumlah Kutipan (RM)',
                                data: data,
                                backgroundColor: 'rgba(14, 165, 233, 0.6)',
                                borderColor: 'rgba(14, 165, 233, 1)',
                                borderWidth: 1,
                                borderRadius: 8
                            }]
                        },
                        options: { 
                            responsive: true, 
                            plugins: { legend: { display: false } }, 
                            scales: { 
                                y: { beginAtZero: true, grid: { display: false } }, 
                                x: { grid: { display: false } } 
                            } 
                        }
                    });
                }
            }, [view, stats, loading, currentUser]);

            if (!currentUser) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-sky-50 p-4 fade-in">
                        <div className="mb-8 text-center">
                            <div className="w-20 h-20 rounded-full mx-auto mb-4 shadow-lg shadow-slate-200 bg-white flex items-center justify-center overflow-hidden border border-slate-100">
                                <img src="icons/logo-master.png" alt="Logo PASTI" className="w-full h-full object-contain p-1" />
                            </div>
                            <h1 className="text-3xl font-bold text-slate-800">Sistem {namaSistem}</h1>
                            <p className="text-slate-500 mt-2 font-medium">Log Masuk Admin Pentadbir</p>
                        </div>
                        <form onSubmit={handleLogin} className="bg-white p-8 rounded-3xl shadow-xl border border-slate-100 w-full max-w-sm space-y-6">
                            {loginError && (
                                <div className="p-4 bg-red-50 text-red-600 text-sm rounded-xl border border-red-100 flex items-center gap-2">
                                    <Icon name="alert-circle" size={16} /> {loginError}
                                </div>
                            )}
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-2">E-mel / ID Log Masuk</label>
                                <div className="relative">
                                    <span className="absolute left-4 top-3.5 text-slate-400"><Icon name="mail" size={18} /></span>
                                    {/* type="text" (bukan "email") — admin biasa boleh log masuk guna ID
                                        ringkas (cth "cikguah"), bukan semestinya format e-mel. SuperAdmin
                                        tetap guna e-mel sebenar macam biasa. Validasi sebenar di server. */}
                                    <input type="text" required value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-sky-500 outline-none transition bg-slate-50" placeholder="admin@tadika.com atau ID log masuk" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-2">Kata Laluan</label>
                                <div className="relative">
                                    <span className="absolute left-4 top-3.5 text-slate-400"><Icon name="lock" size={18} /></span>
                                    <input type="password" required value={loginPassword} onChange={e => setLoginPassword(e.target.value)} className="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-sky-500 outline-none transition bg-slate-50" placeholder="••••••••" />
                                </div>
                            </div>
                            <button type="submit" disabled={isLoggingIn} className="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-xl transition flex justify-center items-center gap-2 disabled:opacity-70 mt-4">
                                {isLoggingIn ? <div className="animate-spin rounded-full h-5 w-5 border-t-2 border-b-2 border-white"></div> : <><Icon name="log-in" size={20} /> Log Masuk</>}
                            </button>
                        </form>
                    </div>
                );
            }

            if (loading) return <Loading />;
            if (error) return <ErrorScreen message={error} onRetry={fetchData} />;

            return (
                <div className="flex min-h-screen">
                    {/* TOAST — popup "Berjaya"/ralat kat penjuru atas-kanan, auto-hilang.
                        Rujuk showToast() untuk cara panggil dari mana-mana action. */}
                    <div className="fixed top-4 right-4 z-[100] flex flex-col gap-2 items-end pointer-events-none">
                        {toasts.map(t => (
                            <div
                                key={t.id}
                                className={`pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-sm font-semibold max-w-xs fade-in ${
                                    t.type === 'error' ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'
                                }`}
                            >
                                <Icon name={t.type === 'error' ? 'alert-circle' : 'check-circle-2'} size={18} />
                                <span>{t.message}</span>
                            </div>
                        ))}
                    </div>

                    {/* SIDEBAR */}
                    {/* BACKDROP — mobile sahaja, klik luar drawer untuk tutup */}
                    {mobileNavOpen && (
                        <div className="fixed inset-0 bg-black/40 z-30 md:hidden" onClick={() => setMobileNavOpen(false)}></div>
                    )}

                    {/* SIDEBAR / DRAWER — satu-satunya sumber nav (desktop: fixed,
                        mobile: slide-in drawer). JANGAN buat list nav berasingan
                        untuk mobile — itu punca asal bug tab hilang sebelum ni. */}
                    <aside className={`w-64 bg-white flex flex-col border-r border-slate-100 fixed h-full z-40 transform transition-transform duration-300 ease-in-out md:translate-x-0 md:z-10 ${mobileNavOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-6 flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl flex items-center justify-center bg-white shadow-sm border border-slate-100 overflow-hidden">
                                <img src="icons/logo-master.png" alt="Logo PASTI" className="w-full h-full object-contain p-0.5" />
                            </div>
                            <div className="flex-1">
                                <h1 className="font-bold text-slate-800 text-lg">{namaSistem}</h1>
                                <p className="text-xs text-sky-600 font-bold">{currentUser.Role.toLowerCase() === 'superadmin' ? 'Super Admin' : `Admin ${currentUser.Cawangan}`}</p>
                            </div>
                            <button onClick={() => setMobileNavOpen(false)} className="md:hidden p-2 text-slate-400 hover:text-slate-600">
                                <Icon name="x" size={20} />
                            </button>
                        </div>

                        <nav className="flex-1 px-4 space-y-2 mt-4 overflow-y-auto" onClick={() => setMobileNavOpen(false)}>
                            <button onClick={() => { setView('dashboard'); setSelectedStudent(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${view === 'dashboard' ? 'sidebar-active' : 'text-slate-500 hover:bg-slate-50'}`}>
                                <Icon name="layout-dashboard" size={20} /> <span>Dashboard</span>
                            </button>
                            <button onClick={() => { setView('students'); setSelectedStudent(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${view === 'students' ? 'sidebar-active' : 'text-slate-500 hover:bg-slate-50'}`}>
                                <Icon name="users" size={20} /> <span>Senarai Pelajar</span>
                            </button>
                            <button onClick={() => { setView('transactions'); setSelectedStudent(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${view === 'transactions' ? 'sidebar-active' : 'text-slate-500 hover:bg-slate-50'}`}>
                                <Icon name="credit-card" size={20} /> <span>Rekod Transaksi</span>
                            </button>
                            {canDo('GET_PAYMENT_MATRIX') && (
                                <button onClick={() => { setView('matrix'); setSelectedStudent(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${view === 'matrix' ? 'sidebar-active' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    <Icon name="table" size={20} /> <span>Matrix Bayaran</span>
                                </button>
                            )}
                            {canDo('GET_ADHOC_FEES') && (
                                <button onClick={() => { setView('adhoc'); setSelectedStudent(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${view === 'adhoc' ? 'sidebar-active' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    <Icon name="shirt" size={20} /> <span>Yuran Lain-Lain</span>
                                </button>
                            )}
                            <button onClick={() => { setView('database'); setSelectedStudent(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${view === 'database' || view === 'addstudent' ? 'sidebar-active' : 'text-slate-500 hover:bg-slate-50'}`}>
                                <Icon name="database" size={20} /> <span>Database Pelajar</span>
                            </button>
                            {canDo('LIST_GURU') && (
                                <button onClick={() => { setView('guru'); setSelectedStudent(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${view === 'guru' ? 'sidebar-active' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    <Icon name="graduation-cap" size={20} /> <span>Database Guru</span>
                                </button>
                            )}
                            {/* Urus Admin & Log Masuk — hardcoded SuperAdmin sahaja (BUKAN
                                canDo(), sebab dua action ni sengaja tak configurable — rujuk
                                nota PERMISSION_ACTIONS_ dalam Code.gs). */}
                            {currentUser.Role.toLowerCase() === 'superadmin' && (
                                <button onClick={() => { setView('admins'); setSelectedStudent(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${view === 'admins' ? 'sidebar-active' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    <Icon name="user-cog" size={20} /> <span>Urus Admin</span>
                                </button>
                            )}
                            {currentUser.Role.toLowerCase() === 'superadmin' && (
                                <button onClick={() => { setView('loginlog'); setSelectedStudent(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${view === 'loginlog' ? 'sidebar-active' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    <Icon name="history" size={20} /> <span>Log Masuk</span>
                                </button>
                            )}
                            {currentUser.Role.toLowerCase() === 'superadmin' && (
                                <button onClick={() => { setView('settings'); setSelectedStudent(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${view === 'settings' ? 'sidebar-active' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    <Icon name="settings" size={20} /> <span>Tetapan</span>
                                </button>
                            )}
                        </nav>

                        <div className="p-6 mt-auto">
                            <button onClick={handleLogout} className="mb-4 w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl text-rose-500 hover:bg-rose-50 font-bold transition border border-rose-100 shadow-sm">
                                <Icon name="log-out" size={18} /> Log Keluar
                            </button>
                            <div className="bg-gradient-to-br from-indigo-500 to-purple-500 rounded-xl p-4 text-white shadow-lg shadow-indigo-200 cursor-pointer hover:shadow-xl transition" onClick={fetchData} title="Klik untuk refresh data">
                                <p className="text-xs opacity-80 mb-1 flex justify-between items-center">
                                    Status Sistem <Icon name="refresh-cw" size={14} className="opacity-70 hover:opacity-100" />
                                </p>
                                <div className="flex items-center gap-2">
                                    <div className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                                    <span className="text-sm font-semibold">Online (Live)</span>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT */}
